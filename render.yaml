services:
  # Backend Web Service (Serves APIs + Built Frontend)
  - type: web
    name: greenfresh-backend
    runtime: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_EMAIL
        value: admin@greenfresh.com
      - key: ADMIN_PASSWORD
        sync: false

  # Frontend Static Site
  - type: static
    name: greenfresh-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: greenfresh-backend
          property: host
